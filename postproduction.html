<body class="page-editor-dig">

  <nav class="nav nav--blend">
    <a href="index.html" class="nav-home" data-content="navLabels.home">← home</a>
    <ul class="nav-sections">
      <li><a href="preproduction.html"  data-content="navLabels.preproduction">preproduction</a></li>
      <li><a href="production.html"     data-content="navLabels.production">production</a></li>
      <li><a href="postproduction.html" class="is-current" data-content="navLabels.postproduction">postproduction</a></li>
    </ul>
  </nav>

  <section class="dig-world" id="digWorld">

    <div class="dig-sky" aria-hidden="true"></div>

    <!-- DEEP BACKGROUND — hills with scroll-parallax (slowest movers) -->
    <div class="dig-hills" aria-hidden="true">
      <img class="hill hill-back"  src="assets/scenery/hill-back.png"  alt="" data-parallax="0.15">
      <img class="hill hill-mid"   src="assets/scenery/hill-mid.png"   alt="" data-parallax="0.25">
      <img class="hill hill-front" src="assets/scenery/hill-front.png" alt="" data-parallax="0.35">
    </div>

    <div class="dig-clouds" id="digClouds" aria-hidden="true"></div>

    <!-- FOREST layer removed per Charlie — no more parallax trees behind
         the gravestone. Grass strip alone forms the horizon now. -->


    <div class="dig-sky-text-wrap">
      <div class="dig-sky-text">
        <p class="page-eyebrow"  data-content="postproduction.eyebrow">section iii</p>
        <h1 class="page-title"   data-content="postproduction.title">Postproduction.</h1>
        <p class="page-lede"     data-content="postproduction.lede">an editor takes thousands of feet of footage and finds the film hiding inside it...</p>
      </div>
    </div>

    <!-- gravestone — swap by editing assets/gravestone.svg -->
    <div class="dig-gravestone-center" data-art="gravestone" aria-hidden="true"></div>

    <!-- grass strip -->
    <div class="dig-grass" id="digGrass" aria-hidden="true">
      <canvas class="dig-grass-canvas" id="digGrassCanvas"></canvas>
    </div>

    <!-- underground -->
    <div class="dig-underground" id="digUnderground">

      <!-- crawling worm — 10-frame sprite from assets/worm-sprite.png.
           Two CSS animations layered: wormCrawl drifts the whole container
           right→left across the sky; wormCycle cycles the sprite frames
           for the crawl motion. Swap the sprite PNG to change look. -->
      <div class="dig-worm" aria-hidden="true"></div>

      <!-- Second worm, one full viewport below the first, moving in the
           opposite direction (left→right). Same sprite, flipped
           horizontally so its face points the way it's traveling. -->
      <div class="dig-worm dig-worm--rev" aria-hidden="true"></div>

      <!-- BURIED TREASURE CHEST — desktop-only easter egg. Chest
           sprite sits INSIDE the underground at opacity:0 — the same
           gradient that covers the rest of the underground is what
           hides it. As the user drags the shovel NEAR the chest (the
           same shovel motion that paints the dig-canvas everywhere
           else), the chest fades in. Once fully faded in, it's
           clickable → 8-frame sprite animation → video. No separate
           dirt cover, no rectangular patch, no direction lock —
           Charlie: 'as natural as the rest of the dirt around it.' -->
      <!-- Chest sprite sits ON TOP of the underground gradient
           background, but UNDER the .dig-chest-cover canvas. That
           canvas is filled with the SAME linear-gradient values the
           underground has at the chest's Y — so at fully-covered
           it's visually indistinguishable from the surrounding dirt.
           postproduction-dig.js erases the canvas with the same
           3-pass stroke spec the underground dig-canvas uses; at
           60% erased the chest is unburied → clickable → animation. -->
      <div class="dig-chest" id="digChest" aria-hidden="true">
        <div class="dig-chest-sprite"></div>
        <!-- Sits just below the chest sprite, under the same dirt
             cover — revealed by digging along with the chest. JS
             swaps textContent to "Click" the moment .is-fully-dug
             fires so the user knows the chest is unlocked. -->
        <p class="dig-chest-hint" id="digChestHint">Keep Digging</p>
        <canvas class="dig-chest-cover" id="digChestCover"></canvas>
      </div>

      <!-- coffins are rendered from content.json into this container -->
      <div data-template="coffinTpl" data-source="postproduction.coffins"></div>

      <template id="coffinTpl">
        <article class="coffin" data-style-from="position">
          <!-- Plush velvet-lined wooden coffin — swap the image at
               assets/coffin.png to change the look of every coffin
               on the page at once. -->
          <img class="coffin-shape" src="assets/coffin.png" alt="" draggable="false">
          <div class="coffin-content">
            <!-- Video thumbnail sits ABOVE the tag inside the velvet
                 lining. video-lightbox.js paints the ytimg background
                 after JSON loads; play button overlay via CSS. Hidden
                 if no youtubeUrl. Rotates with the coffin because
                 .coffin's rotate() transform cascades to all children. -->
            <a class="coffin-video"  data-attr-href="youtubeUrl" data-attr-data-thumbnail="thumbnailUrl" aria-label="Play video">
              <span class="video-play-btn" aria-hidden="true"></span>
            </a>
            <p class="coffin-tag"    data-field="tag"></p>
            <h3 class="coffin-title" data-field="title"></h3>
            <!-- Trapezoidal description panel — the coffin narrows
                 slightly toward the foot so the clip-path polygon
                 hugs the interior instead of clipping past the
                 wooden border. -->
            <p class="coffin-description" data-field="description"></p>
            <p class="coffin-credit" data-field="credit"></p>
          </div>
        </article>
      </template>

      <!-- skeleton coffin — coffin shell from assets/coffin.png, skeleton from assets/skeleton.svg -->
      <article class="coffin coffin--skeleton" id="coffinSkeleton" style="top: 62%; right: 12%; --rot: -10deg;">
        <img class="coffin-shape" src="assets/coffin.png" alt="" draggable="false">
        <div class="coffin-skeleton" data-art="skeleton"></div>
      </article>

      <!-- dirt clumps for atmosphere -->
      <div class="dirt-clump" style="top: 18%; left: 12%;"></div>
      <div class="dirt-clump" style="top: 38%; left: 75%;"></div>
      <div class="dirt-clump" style="top: 48%; left: 30%;"></div>
      <div class="dirt-clump" style="top: 68%; left: 62%;"></div>
      <div class="dirt-clump" style="top: 88%; left: 40%;"></div>

    </div>

  </section>

  <!-- ========== HELL — Charlie falling into hell in the coffin.
       Whole scene is one 4-second loopable video (assets/charlie-in-hell.*).
       Coffin, flames, smoke — all baked into the video, so we no longer
       need the CSS/SVG hell-fire, hell-smoke, or coffin-charlie composition. ========== -->
  <section class="hell" id="hell" aria-label="hell">

    <!-- No <source> elements — postproduction-dig.js picks the right URL
         at load time via matchMedia. Same pattern preproduction uses:
         iOS Safari's <source media="..."> handling is unreliable, so we
         set the source explicitly in JS. Portrait ≤500px gets the vertical
         1080x1920 hell comp; everyone else gets the desktop WebM/MOV. -->
    <video
      class="hell-bg-video"
      id="hellBgVideo"
      muted
      playsinline
      autoplay
      loop
      preload="auto"
      aria-hidden="true"
    ></video>

    <div class="hell-menu"
         data-template="menuLinkTpl"
         data-source="menus.hellMenu">
      <p class="hell-eyebrow">— from down here</p>
    </div>

    <template id="menuLinkTpl">
      <a class="big-link" data-attr-href="href">
        <span class="bl-num"   data-field="num"></span>
        <span class="bl-label" data-field="label"></span>
        <span class="bl-arrow">↗</span>
      </a>
    </template>
  </section>

  <footer class="page-footer page-footer--hell">
    <p data-content="site.email">charlie@charliehane.com</p>
    <p>see you on the other side.</p>
  </footer>

  <script src="building-blocks/js/content-loader.js"></script>
  <script src="building-blocks/js/video-lightbox.js?v=vimeo-thumbs"></script>
  <script src="building-blocks/js/art-loader.js"></script>
  <script src="building-blocks/js/postproduction-dig.js?v=grid-strict"></script>
</body>
</html>
