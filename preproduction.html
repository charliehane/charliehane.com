<body class="page-producer page-producer-ride">

  <!-- Loading overlay (reusable — see loading-overlay.js). Preproduction
       uses the bike centerpiece. Hides once BG + FG videos are ready
       for smooth scrubbing (preproduction.js wires the check). -->
  <div class="page-loading" id="pageLoading" aria-hidden="true">
    <div class="page-loading-texture" id="pageLoadingTexture"></div>
    <div class="page-loading-content">
      <span class="page-loading-text" id="pageLoadingText">LOADING</span>
      <div class="page-loading-centerpiece page-loading-centerpiece--bike" id="pageLoadingCenterpiece" aria-hidden="true"></div>
    </div>
  </div>

  <nav class="nav nav--blend">
    <a href="index.html" class="nav-home" data-content="navLabels.home">← home</a>
    <ul class="nav-sections">
      <li><a href="preproduction.html"  class="is-current" data-content="navLabels.preproduction">preproduction</a></li>
      <li><a href="production.html"     data-content="navLabels.production">production</a></li>
      <li><a href="postproduction.html" data-content="navLabels.postproduction">postproduction</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <p class="page-eyebrow"  data-content="preproduction.eyebrow">section i</p>
    <h1 class="page-title"   data-content="preproduction.title">Preproduction.</h1>
    <p class="page-lede"     data-content="preproduction.lede">ride through the films i've shepherded — click to jump and bust the bricks open.</p>
  </header>

  <section class="world-section" id="worldSection">
    <div class="world-pin">

      <!-- Fixed-aspect stage. Locks the entire bike-ride composition (BG
           video, FG video, bricks, bike) into a 1.89:1 window matching
           the AE render, then centers it inside .world-pin. Above/below
           the stage is black letterbox — so the three layers always
           align regardless of viewport aspect ratio (iPhone portrait,
           iPad, desktop, or a resized window). The stage's width
           becomes the reference dimension (--stage-w) that scene widths
           and bike sizes are derived from, so nothing scales
           independently anymore. -->
      <div class="world-stage" id="worldStage">

      <!-- Scroll-scrubbed background video — Charlie's AE bike journey. The
           video's currentTime is driven by scroll progress in preproduction.js.
           Lives behind .world-track-clip so the bricks/bike/car render on top. -->
      <!-- BG layer — hosted on R2 because at 87MB it exceeds Pages' 25MB cap.
           Plays scroll-driven scrub at native 1440p all-intra. -->
      <video
        class="world-bg-video"
        id="worldBgVideo"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disableRemotePlayback
        aria-hidden="true"
      >
        <!-- Portrait iPhone: 1080x1920 vertical re-composition. Browsers
             pick the first <source> whose media query matches; portrait
             ≤500px gets the vertical file, everyone else falls through
             to the horizontal desktop file. -->
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-bg-portrait.mp4"
                media="(orientation: portrait) and (max-width: 500px)"
                type="video/mp4">
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-bg.mp4"
                type="video/mp4">
      </video>

      <!-- FG layer — closer/sparser scenery with alpha so the BG shows
           through the gaps. Two source formats needed because no single
           codec has alpha support across every browser:
              • WebM/VP9+alpha → Chrome, Firefox, Edge
              • MP4/HEVC+alpha → Safari, iOS
           The browser picks the first <source> it can decode. Both files
           are scrubbed in lockstep with the BG via preproduction.js. -->
      <video
        class="world-fg-video"
        id="worldFgVideo"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disableRemotePlayback
        aria-hidden="true"
      >
        <!-- Portrait iPhone: 1080x1920 vertical FG with alpha. HEVC MOV
             first so iOS Safari picks it (native codec); WebM VP9 with
             alpha second for Chrome / Firefox / Edge. Both media-query
             gated to portrait ≤500px so only phones see them. -->
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-fg-portrait.mov"
                media="(orientation: portrait) and (max-width: 500px)"
                type='video/mp4; codecs="hvc1"'>
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-fg-portrait.webm"
                media="(orientation: portrait) and (max-width: 500px)"
                type="video/webm">
        <!-- Desktop / tablet / landscape fallback (existing files) -->
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-fg.webm" type="video/webm">
        <source src="https://pub-3feaceb432134076b4773fdc45eba874.r2.dev/bike-scene-fg.mov" type='video/mp4; codecs="hvc1"'>
      </video>

      <div class="world-track-clip">
      <div class="world-track" id="worldTrack"
           data-template="sceneTpl"
           data-source="preproduction.films"
           data-item-prefix="scene">
      </div>
      </div><!-- /.world-track-clip -->

      <template id="sceneTpl" data-modifier-count="5">
        <div class="scene" data-modifier>
          <span class="scene-num"  data-field="sceneNum"></span>
          <span class="scene-name" data-field="scene"></span>
          <button class="brick" type="button" aria-label="reveal project">
            <span class="brick-rivets" aria-hidden="true"></span>
            <span class="brick-mark">?</span>
          </button>
          <div class="brick-popup">
            <p class="popup-tag"     data-field="tag"></p>
            <h4 class="popup-title"  data-field="title"></h4>
            <p class="popup-meta"    data-field="meta"></p>
          </div>
        </div>
      </template>

      <p class="world-caption" data-content="preproduction.caption">scroll to ride · click to jump</p>
      <div class="world-progress"><div class="world-progress-bar" id="worldProgressBar"></div></div>

      <!-- bike + stick figure rider — lives INSIDE .world-pin so it shares
           the same stacking context as the BG/FG videos. That lets z-index
           order BG < bricks < bike < FG actually work; previously the bike
           was a sibling of .world-pin and its z-index couldn't reach into
           the FG video's stacking context above it. -->
      <div class="world-bike-stage">
        <div class="world-bike-pos" id="worldBikePos">
          <!-- Bike: 14-frame sprite from assets/bike-sprite.png. Frame index
               advances based on scroll velocity (preproduction.js handles it). -->
          <div class="world-bike world-bike--sprite" id="worldBike" aria-hidden="true"></div>
          <!-- Crashed bike: shown at crashProgress when the launched figure
               flies off. Inherits the same .world-bike positioning + rotation
               (--crashRot cascades from .world-bike-pos), so it takes over
               the rotation animation already in progress without any jump. -->
          <div class="world-bike world-bike-crashed" id="worldBikeCrashed" aria-hidden="true"></div>
        </div>

        <!-- Launched figure (post-crash, flies through the air).
             10-frame photo sprite from assets/you-sprite.png — the same
             character we use for the production-page cursor. The inner
             div is the actual sprite background; preproduction.js cycles
             its background-position-x to animate the spin as the body
             flies through its arc. -->
        <div class="launched-figure" id="launchedFigure" aria-hidden="true">
          <div class="launched-figure-sprite" id="launchedFigureSprite"></div>
        </div>
      </div>
      </div><!-- /.world-stage -->
    </div>
  </section>

  <!-- post-ride menu — rendered from content.json -->
  <section class="post-ride-menu"
           data-template="menuLinkTpl"
           data-source="menus.afterPreproduction">
    <p class="sections-eyebrow">— off the bike. where to next?</p>
  </section>

  <template id="menuLinkTpl">
    <a class="big-link" data-attr-href="href">
      <span class="bl-num"   data-field="num"></span>
      <span class="bl-label" data-field="label"></span>
      <span class="bl-arrow">↗</span>
    </a>
  </template>

  <footer class="page-footer">

    <p data-content="site.moreSoon">more soon.</p>
  </footer>
